name: Stop callback checks

on:
  push:
    paths: ["**.ipynb", "tests/**", "requirements-checks.txt", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["**.ipynb", "tests/**", "requirements-checks.txt", ".github/workflows/checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m unittest discover -s tests -v
